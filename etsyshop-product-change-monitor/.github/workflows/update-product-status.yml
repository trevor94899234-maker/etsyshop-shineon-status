name: Update EtsyShop product change monitor

on:
  schedule:
    # Refresh every six hours at minute 37 (UTC).
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etsyshop-product-pages
  cancel-in-progress: false

jobs:
  update-product-status:
    name: Fetch product data and prepare Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch product cost, shipping and production data
        run: node scripts/fetch-etsyshop-product-data.mjs

      - name: Commit updated product snapshot when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/product-status.json)" ]]; then
            echo "Product snapshot has not changed; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/product-status.json
          git commit -m "chore: update EtsyShop product snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/product-status.json _site/data/product-status.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy product monitor to GitHub Pages
    needs: update-product-status
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
