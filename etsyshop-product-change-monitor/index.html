<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EtsyShop product cost, shipping and production change monitor.">
  <title>EtsyShop · Product Change Monitor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2532;
      --muted: #657184;
      --line: #dfe4ea;
      --paper: #f6f8fb;
      --card: #ffffff;
      --navy: #18324b;
      --teal: #0f766e;
      --cost: #a16207;
      --fulfillment: #0f766e;
      --shipping: #315a7b;
      --amber: #a15c00;
      --red: #b42318;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    a { color: var(--navy); }
    .shell { width: min(1160px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 18px; }
    .eyebrow { color: var(--teal); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 7px 0 8px; color: var(--navy); font-size: clamp(1.8rem, 4vw, 3.2rem); line-height: 1.02; }
    .lede { max-width: 720px; margin: 0; color: var(--muted); line-height: 1.6; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); padding: 7px 11px; font-size: .82rem; }
    .pill strong { color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 10px 0 20px; }
    .metric, .panel { border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: 0 8px 24px rgba(24, 50, 75, .05); }
    .metric { padding: 18px; }
    .metric-label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
    .metric-value { margin-top: 6px; color: var(--navy); font-size: 1.8rem; font-weight: 800; }
    .panel { margin: 14px 0; overflow: hidden; }
    .panel-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; color: var(--navy); font-size: 1.2rem; }
    .panel-head p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .family-summary { list-style: none; cursor: pointer; }
    .family-summary::-webkit-details-marker { display: none; }
    .family-summary::after { content: '+'; color: var(--teal); font-size: 1.4rem; font-weight: 500; line-height: 1; }
    .family-panel[open] .family-summary::after { content: '−'; }
    .badge { display: inline-flex; border-radius: 999px; padding: 5px 9px; font-size: .75rem; font-weight: 800; white-space: nowrap; }
    .badge.good { background: #e7f7f2; color: var(--teal); }
    .badge.change { background: #fff3d6; color: var(--amber); }
    .badge.missing { background: #fdecea; color: var(--red); }
    .alert { margin: 14px 0; border: 1px solid #f2d299; border-radius: 12px; background: #fff8e8; color: #704700; padding: 12px 14px; line-height: 1.5; }
    .alert.error { border-color: #f3b7b2; background: #fff1f0; color: var(--red); }
    .status-panel { --status-color: #657184; --section-color: #5656a6; margin: 14px 0 18px; border: 1px solid var(--line); border-top: 5px solid var(--section-color); border-radius: 16px; background: var(--card); box-shadow: 0 8px 24px rgba(24, 50, 75, .05); overflow: hidden; }
    .status-panel.status-operational { --status-color: #238b62; }
    .status-panel.status-degraded { --status-color: #a16207; }
    .status-panel.status-outage { --status-color: #b42318; }
    .status-panel.status-unknown { --status-color: #657184; }
    .status-head { display: flex; justify-content: space-between; align-items: start; gap: 18px; padding: 18px 20px 14px; border-bottom: 1px solid #dfdef3; background: #f5f4ff; }
    .status-panel .eyebrow { color: var(--section-color); }
    .view-summary { position: relative; cursor: pointer; list-style: none; padding-right: 58px; }
    .view-summary::-webkit-details-marker { display: none; }
    .view-summary::after { position: absolute; top: 50%; right: 18px; content: '+'; color: var(--section-color, var(--teal)); font-size: 1.45rem; font-weight: 500; line-height: 1; transform: translateY(-50%); }
    .view-summary > .section-status { align-self: center; margin-left: auto; margin-right: 16px; }
    .view-section[open] > .view-summary::after { content: '−'; }
    .section-status { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 5px 9px; font-size: .75rem; font-weight: 800; white-space: nowrap; }
    .section-status::before { width: 9px; height: 9px; border-radius: 50%; background: currentColor; content: ''; }
    .section-status.good { color: #147b5b; background: #e7f7f2; }
    .section-status.review { color: #8a5b00; background: #fff3d6; }
    .section-status.error { color: var(--red); background: #fdecea; }
    .section-status.unknown { color: var(--muted); background: #eef1f4; }
    .status-head h2 { margin: 3px 0 0; color: var(--navy); font-size: 1.2rem; }
    .status-head p { margin: 5px 0 0; color: var(--muted); font-size: .88rem; }
    .status-indicator { display: inline-flex; align-items: center; gap: 8px; color: var(--status-color); font-size: .92rem; font-weight: 800; white-space: nowrap; }
    .status-indicator::before { width: 11px; height: 11px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 14%, transparent); content: ''; }
    .status-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 20px 16px; }
    .status-grid-compact { grid-template-columns: minmax(0, 1fr); }
    .status-metric { border: 1px solid var(--line); border-radius: 11px; background: #fbfcfd; padding: 11px 12px; }
    .status-metric span { display: block; color: var(--muted); font-size: .73rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .status-metric strong { display: block; margin-top: 5px; color: var(--ink); font-size: .92rem; line-height: 1.35; }
    .status-note { margin: 0 20px 16px; border-radius: 10px; background: #eef7f4; color: #14604f; padding: 10px 12px; font-size: .84rem; line-height: 1.45; }
    .status-note-change { background: #fff3d6; color: #704700; }
    .status-change-list { display: grid; gap: 5px; margin: 8px 0 0; padding-left: 18px; }
    .status-components { margin: 0 20px 14px; border-top: 1px solid var(--line); padding-top: 12px; }
    .status-components summary { color: var(--navy); }
    .component-list { display: grid; gap: 0; margin-top: 10px; }
    .component-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 9px 0; }
    .component-row:last-child { border-bottom: 0; }
    .component-name { color: var(--ink); font-size: .86rem; font-weight: 750; }
    .component-group { display: block; margin-top: 3px; color: var(--muted); font-size: .74rem; }
    .component-status { flex: 0 0 auto; border-radius: 999px; padding: 5px 8px; font-size: .72rem; font-weight: 800; }
    .component-status.operational { background: #e7f7f2; color: #147b5b; }
    .component-status.degraded { background: #fff3d6; color: #8a5b00; }
    .component-status.outage { background: #fdecea; color: var(--red); }
    .component-status.unknown { background: #eef1f4; color: var(--muted); }
    .status-sources { padding: 0 20px 16px; color: var(--muted); font-size: .78rem; }
    .status-sources a { margin-left: 10px; }
    .status-summary .status-indicator { margin-right: 4px; }
    .changes { padding: 16px 20px; }
    .change-row { display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(180px, 1fr) minmax(140px, .7fr); gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 10px 0; font-size: .9rem; }
    .change-row:last-child { border-bottom: 0; }
    .change-product { font-weight: 700; }
    .change-field { color: var(--muted); }
    .value-old { color: var(--muted); text-decoration: line-through; }
    .value-new { color: var(--ink); font-weight: 800; }
    .change-row.increase .value-new, .change-row.missing .value-new { color: var(--red); }
    .change-row.decrease .value-new, .change-row.provided .value-new { color: var(--teal); }
    .change-direction { display: inline-block; margin-left: 7px; color: var(--muted); font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .family-body { padding: 0 20px 18px; }
    .variant { border-bottom: 1px solid var(--line); padding: 16px 0; }
    .variant:last-child { border-bottom: 0; }
    .variant-summary { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .variant-name { font-weight: 750; line-height: 1.35; }
    .variant-summary small { display: block; margin-top: 4px; color: var(--muted); }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--navy); font-size: .86rem; font-weight: 700; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
    .detail-block h3 { margin: 0 0 7px; color: var(--navy); font-size: .88rem; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { border-bottom: 1px solid var(--line); padding: 7px 5px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: .73rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    td:last-child { text-align: right; }
    .source-list { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 16px 20px 20px; font-size: .85rem; }
    .source-list a { overflow-wrap: anywhere; }
    .visual-suite { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin: 14px 0 20px; }
    .visual-suite .fulfillment-panel { order: 1; }
    .visual-suite .cost-panel { order: 2; }
    .visual-suite .catalog-heading { order: 3; }
    .visual-panel.cost-panel { border-top: 5px solid var(--cost); }
    .visual-panel.cost-panel .visual-panel-head { background: #fff8e8; }
    .visual-panel.fulfillment-panel { border-top: 5px solid var(--fulfillment); }
    .visual-panel.fulfillment-panel .visual-panel-head { background: #eef9f6; }
    .family-panel.shipping-panel { border-top: 5px solid var(--shipping); }
    .family-panel.shipping-panel .family-summary { background: #f1f6fa; }
    .shipping-view { border-top: 5px solid var(--shipping); }
    .shipping-view > .view-summary { background: #f1f6fa; }
    .shipping-catalog-body { padding: 0 0 4px; }
    .shipping-catalog-body .family-panel { margin: 12px 20px; }
    .visual-panel { min-width: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: 0 8px 24px rgba(24, 50, 75, .05); overflow: hidden; }
    .visual-panel-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding: 18px 20px 10px; }
    .visual-panel-head.view-summary { padding-right: 58px; }
    .visual-panel-head h2 { margin: 0; color: var(--navy); font-size: 1.15rem; }
    .visual-panel-head p { margin: 5px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    .visual-panel-body { padding-bottom: 4px; }
    .visual-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 0 20px 10px; }
    .visual-controls label { display: grid; gap: 5px; color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .visual-controls select { min-width: 230px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); padding: 9px 10px; font: inherit; font-size: .86rem; }
    .chart-wrap { padding: 4px 14px 16px; }
    .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-wrap .chart-axis { fill: var(--muted); font-size: 12px; }
    .chart-wrap .chart-label { fill: var(--ink); font-size: 12px; }
    .chart-wrap .chart-muted { fill: var(--muted); font-size: 11px; }
    .chart-wrap .chart-value { fill: var(--ink); font-size: 12px; font-weight: 800; }
    .chart-wrap .chart-grid { stroke: var(--line); stroke-width: 1; }
    .chart-wrap .cost-bar { fill: var(--teal); }
    .chart-wrap .cost-bar-label { fill: var(--card); font-size: 12px; font-weight: 800; }
    .chart-wrap .range-line { stroke: var(--navy); stroke-linecap: round; stroke-width: 9; }
    .chart-wrap .range-dot { fill: var(--teal); stroke: var(--card); stroke-width: 3; }
    .chart-wrap .range-dot.end { fill: var(--navy); }
    .chart-caption { margin: 0 20px 4px; color: var(--muted); font-size: .82rem; line-height: 1.45; }
    .visual-empty { margin: 8px 20px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); padding: 14px; font-size: .86rem; }
    .product-list-toggle > summary { list-style: none; cursor: pointer; }
    .product-list-toggle > summary::-webkit-details-marker { display: none; }
    .product-list-summary::after { content: '+'; color: var(--teal); font-size: 1.4rem; font-weight: 500; line-height: 1; }
    .product-list-toggle[open] .product-list-summary::after { content: '−'; }
    .product-list { display: grid; gap: 0; padding: 4px 20px 18px; }
    .product-cost-sections { display: grid; gap: 10px; padding: 0 20px 18px; }
    .product-cost-sections > details { margin-top: 0; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
    .product-cost-sections > details > summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 13px; background: #fffdf7; }
    .product-cost-sections > details > summary > div { display: grid; gap: 3px; }
    .product-cost-sections > details > summary small { color: var(--muted); font-size: .76rem; }
    .product-cost-sections > details[open] > summary { border-bottom: 1px solid var(--line); }
    .product-cost-sections > details > summary::after { content: '+'; color: var(--cost); font-size: 1.25rem; font-weight: 500; }
    .product-cost-sections > details[open] > summary::after { content: '−'; }
    .product-cost-sections .product-list { padding: 4px 13px 13px; }
    .product-list-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding: 11px 0; }
    .product-list-name { color: var(--ink); font-size: .84rem; line-height: 1.35; }
    .product-list-price { flex: 0 0 auto; color: var(--teal); font-size: .88rem; font-weight: 800; white-space: nowrap; }
    .catalog-heading { border-left: 5px solid var(--shipping); border-radius: 0 10px 10px 0; background: #f1f6fa; padding: 12px 14px 10px; }
    .catalog-heading h2 { margin: 0; color: var(--navy); font-size: 1.3rem; }
    .catalog-heading p { margin: 5px 0 0; color: var(--muted); font-size: .88rem; }
    .catalog-type { display: flex; width: fit-content; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .catalog-type::before { width: 18px; height: 5px; border-radius: 99px; background: currentColor; content: ''; }
    .product-type { color: var(--cost); }
    .fulfillment-type { color: var(--fulfillment); }
    .shipping-type { color: var(--shipping); }
    .badge.shipping-badge { background: #e8eff5; color: var(--shipping); }
    .cost-chart { display: grid; gap: 13px; padding: 8px 6px 0; }
    .cost-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 58px; gap: 9px; align-items: center; }
    .cost-row-label { color: var(--muted); font-size: .76rem; line-height: 1.2; }
    .cost-track { height: 28px; border-radius: 999px; background: #e9eef2; overflow: hidden; }
    .cost-fill { display: flex; align-items: center; justify-content: flex-end; min-width: 28px; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), #23a392); padding-right: 8px; color: #fff; font-size: .74rem; font-weight: 800; }
    .cost-value { color: var(--ink); font-size: .84rem; font-weight: 800; text-align: right; }
    .chart-scale { display: flex; justify-content: space-between; margin: 0 67px 7px 121px; color: var(--muted); font-size: .7rem; }
    .timeline-chart { display: grid; gap: 14px; padding: 8px 6px 0; }
    .timeline-scale { display: flex; justify-content: space-between; margin-left: 142px; color: var(--muted); font-size: .7rem; }
    .timeline-row { display: grid; grid-template-columns: 122px minmax(0, 1fr); grid-template-rows: auto auto; gap: 3px 10px; align-items: center; }
    .timeline-label strong { display: block; color: var(--ink); font-size: .78rem; }
    .timeline-label small { display: block; margin-top: 3px; color: var(--muted); font-size: .7rem; }
    .timeline-label { grid-column: 1; grid-row: 1 / 3; }
    .timeline-rail { position: relative; height: 24px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); background: repeating-linear-gradient(90deg, transparent 0, transparent calc(20% - 1px), var(--line) calc(20% - 1px), var(--line) 20%); }
    .timeline-row .timeline-rail { grid-column: 2; grid-row: 1; }
    .timeline-range { position: absolute; top: 5px; height: 10px; min-width: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--teal) 0 42%, var(--navy) 42% 100%); }
    .timeline-range::before, .timeline-range::after { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--ink); content: ''; }
    .timeline-range::before { left: 0; }
    .timeline-range::after { right: 0; }
    .timeline-days { grid-column: 2; grid-row: 2; justify-self: end; color: var(--ink); font-size: .74rem; font-weight: 800; white-space: nowrap; }
    .timeline-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 3px 0 0 142px; color: var(--muted); font-size: .72rem; }
    .timeline-legend span::before { display: inline-block; width: 18px; height: 6px; margin-right: 5px; border-radius: 999px; background: var(--teal); content: ''; vertical-align: middle; }
    .timeline-legend span:last-child::before { background: var(--navy); }
    footer { padding: 8px 0 32px; color: var(--muted); font-size: .8rem; line-height: 1.6; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 620px); }
      .grid { grid-template-columns: 1fr; }
      .change-row { grid-template-columns: 1fr; gap: 4px; }
      .detail-grid { grid-template-columns: 1fr; }
      .panel-head { flex-direction: column; }
      .visual-suite { grid-template-columns: 1fr; }
      .visual-panel-head { flex-direction: column; }
      .status-head { flex-direction: column; gap: 8px; }
      .status-grid { grid-template-columns: 1fr; }
      .visual-controls { align-items: stretch; flex-direction: column; }
      .visual-controls select { width: 100%; min-width: 0; }
      .product-list-row { align-items: start; flex-direction: column; gap: 4px; }
      .cost-row { grid-template-columns: 92px minmax(0, 1fr) 52px; gap: 7px; }
      .chart-scale { margin-left: 99px; margin-right: 60px; }
      .timeline-row { grid-template-columns: 100px minmax(0, 1fr); gap: 3px 8px; }
      .timeline-scale, .timeline-legend { margin-left: 108px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <p style="margin:14px 0 0;font-size:.82rem;"><a href="../">← ShineOn status monitor</a></p>
    <header>
      <div class="eyebrow">EtsyShop operations extension</div>
      <h1>Product Change Monitor</h1>
      <p class="lede">A snapshot-based view of product cost, regional shipping prices, shipping windows and production ranges for the Journal and Acrylic Plaque families.</p>
      <div id="meta" class="meta"></div>
    </header>

    <main id="app" aria-live="polite">
      <div class="alert">Loading product snapshot…</div>
    </main>

    <footer id="footer"></footer>
  </div>

  <script>
    const DATA_URL = './data/product-status.json';
    document.title = 'EtsyShop | Product Change Monitor';
    const subscriptionColumns = ['Empire Builder'];
    const subscriptionLabels = { 'Empire Builder': 'Enterprise Builder' };
    const shippingColumns = ['USA Standard', 'USA Priority', 'CA Standard', 'CA Priority', 'EU Standard', 'EU Priority'];

    const escapeHtml = (value) => String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

    const formatDate = (value) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'Unknown time' : date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    };

    const isStale = (value) => {
      const time = new Date(value).getTime();
      return !Number.isFinite(time) || Date.now() - time > 24 * 60 * 60 * 1000;
    };

    const renderError = (message) => {
      document.querySelector('#app').innerHTML = `<div class="alert error"><strong>Product data unavailable.</strong><br>${escapeHtml(message)}</div>`;
    };

    const renderVariant = (product, changesByProduct) => {
      const variantChanges = changesByProduct.get(product.productKey) || [];
      const summaryShipping = product.shipping['USA Standard'];
      const changedBadge = variantChanges.length > 0 ? `<span class="badge change">${variantChanges.length} change${variantChanges.length === 1 ? '' : 's'}</span>` : '';
      const shippingRows = shippingColumns.map((region) => {
        const item = product.shipping[region] || {};
        return `<tr><td>${escapeHtml(region)}</td><td>${escapeHtml(item.price || 'Field not provided')}</td><td>${escapeHtml(item.time || 'Field not provided')}</td></tr>`;
      }).join('');

      return `<article class="variant">
        <div class="variant-summary">
          <div>
            <div class="variant-name">${escapeHtml(product.productName)}</div>
            <small>USA Standard: ${escapeHtml(summaryShipping?.price || 'Field not provided')} · Production: ${escapeHtml(product.production?.range || 'Field not provided')}</small>
          </div>
          ${changedBadge}
        </div>
        <details open>
          <summary>Shipping catalog details</summary>
          <div class="detail-grid">
            <div class="detail-block">
              <h3>Shipping price and time</h3>
              <table><thead><tr><th>Region / method</th><th>Price</th><th>Time</th></tr></thead><tbody>${shippingRows}</tbody></table>
            </div>
          </div>
        </details>
      </article>`;
    };

    const renderFamily = (family, products, changesByProduct) => `<details class="panel family-panel">
      <summary class="panel-head family-summary">
        <div><h2>${escapeHtml(family)}</h2><p>${products.length} tracked variant${products.length === 1 ? '' : 's'} · category production range is shown from the supplied ShineOn article</p></div>
        <span class="badge good">Tracked</span>
      </summary>
      <div class="family-body">${products.map((product) => renderVariant(product, changesByProduct)).join('')}</div>
    </details>`;

    const parseMoney = (value) => {
      const number = Number.parseFloat(String(value ?? '').replace(/[^0-9.-]/g, ''));
      return Number.isFinite(number) ? number : null;
    };

    const parseRange = (value) => {
      const match = String(value ?? '').match(/(\d+)\s*-\s*(\d+)/);
      return match ? { min: Number(match[1]), max: Number(match[2]) } : null;
    };

    const moneyLabel = (value) => '$' + value.toFixed(2);

    const renderCostChart = (product) => {
      const host = document.querySelector('#costChart');
      if (!host || !product) return;
      const rows = subscriptionColumns
        .map((tier) => ({ tier, label: subscriptionLabels[tier] || tier, value: parseMoney(product.pricing?.[tier]) }))
        .filter((row) => row.value !== null);
      if (rows.length === 0) {
        host.innerHTML = '<div class="visual-empty">No product cost fields were provided for this product.</div>';
        return;
      }

      const max = Math.max(...rows.map((row) => row.value), 1);
      const scaleMax = Math.ceil(max / 5) * 5;
      const scale = [0, scaleMax / 2, scaleMax];
      const rowsMarkup = rows.map((row) => {
        const width = Math.max(4, (row.value / scaleMax) * 100);
        return '<div class="cost-row">' +
          '<div class="cost-row-label">' + escapeHtml(row.label) + '</div>' +
          '<div class="cost-track" role="meter" aria-label="' + escapeHtml(row.label) + ' product cost" aria-valuemin="0" aria-valuemax="' + scaleMax + '" aria-valuenow="' + row.value + '">' +
            '<div class="cost-fill" style="width:' + width.toFixed(1) + '%"></div>' +
          '</div>' +
          '<div class="cost-value">' + moneyLabel(row.value) + '</div>' +
        '</div>';
      }).join('');
      host.innerHTML = '<div class="chart-scale" aria-hidden="true">' + scale.map((value) => '<span>' + moneyLabel(value) + '</span>').join('') + '</div><div class="cost-chart" role="img" aria-label="Product cost profile for ' + escapeHtml(product.productName) + '">' + rowsMarkup + '</div>';
    };

    const renderFulfillmentChart = (product) => {
      const host = document.querySelector('#fulfillmentChart');
      if (!host || !product) return;
      const production = parseRange(product.production?.range);
      const routes = shippingColumns.map((region) => {
        const shipping = product.shipping?.[region] || {};
        const transit = parseRange(shipping.time);
        return {
          region,
          price: shipping.price || 'Field not provided',
          transit,
          total: production && transit ? { min: production.min + transit.min, max: production.max + transit.max } : null,
        };
      });
      const completeRoutes = routes.filter((route) => route.total);
      if (!production || completeRoutes.length === 0) {
        host.innerHTML = '<div class="visual-empty">Production or shipping time fields were not provided for this product.</div>';
        return;
      }

      const scaleMax = Math.max(5, Math.ceil(Math.max(...completeRoutes.map((route) => route.total.max)) / 5) * 5);
      const scale = [0, scaleMax / 2, scaleMax];
      const rowsMarkup = routes.map((route) => {
        const detail = route.total
          ? route.total.min + '-' + route.total.max + ' business days'
          : 'Time not provided';
        const left = route.total ? (route.total.min / scaleMax) * 100 : 0;
        const width = route.total ? Math.max(3, ((route.total.max - route.total.min) / scaleMax) * 100) : 0;
        const price = route.price === 'Not Available' ? 'Not Available' : route.price;
        return '<div class="timeline-row">' +
          '<div class="timeline-label"><strong>' + escapeHtml(route.region) + '</strong><small>' + escapeHtml(price) + '</small></div>' +
          '<div class="timeline-rail">' +
            (route.total ? '<div class="timeline-range" style="left:' + left.toFixed(1) + '%;width:' + width.toFixed(1) + '%" role="img" aria-label="' + escapeHtml(route.region + ': ' + detail) + '"></div>' : '') +
          '</div>' +
          '<span class="timeline-days">' + escapeHtml(detail) + '</span>' +
        '</div>';
      }).join('');
      host.innerHTML = '<div class="timeline-scale" aria-hidden="true">' + scale.map((value) => '<span>' + value + ' days</span>').join('') + '</div><div class="timeline-chart" role="img" aria-label="Estimated production plus shipping windows for ' + escapeHtml(product.productName) + '">' + rowsMarkup + '</div><div class="timeline-legend"><span>Production: ' + escapeHtml(production.min + '-' + production.max) + ' days</span><span>Shipping transit window</span></div>';
    };

    const renderVisuals = (products, data) => {
      const acrylicProducts = products.filter((product) => product.family === 'Acrylic Plaque');
      const generalProducts = products.filter((product) => product.family !== 'Acrylic Plaque');
      const options = products.map((product) => '<option value="' + escapeHtml(product.productKey) + '">' + escapeHtml(product.family + ' | ' + product.productName) + '</option>').join('');
      const renderCostRows = (items) => items.length === 0
        ? '<div class="visual-empty">No product cost fields were provided.</div>'
        : items.map((product) => '<div class="product-list-row"><div class="product-list-name">' + escapeHtml(product.productName) + '</div><div class="product-list-price">' + escapeHtml(product.pricing?.['Empire Builder'] || 'Field not provided') + '</div></div>').join('');

      if (!document.querySelector('#visualSuite')) {
        document.querySelector('#app').insertAdjacentHTML('afterbegin',
          '<section id="visualSuite" class="visual-suite" aria-label="Visual product overview">' +
            '<details id="fulfillmentView" class="visual-panel fulfillment-panel view-section">' +
              '<summary class="visual-panel-head view-summary"><div><h2>Fulfillment window</h2><p>Estimated production plus shipping time, shown as a range.<span class="catalog-type fulfillment-type">Fulfillment / shipping</span></p></div><span id="fulfillmentSummaryStatus" class="section-status good">Normal</span></summary>' +
              '<div class="visual-panel-body"><div class="visual-controls"><label for="visualProductSelect">Choose a product<select id="visualProductSelect">' + options + '</select></label></div><p class="chart-caption">The range is a planning window, not an order-specific ship date.</p><div id="fulfillmentChart" class="chart-wrap"></div></div>' +
            '</details>' +
            '<details id="productCostView" class="visual-panel cost-panel view-section">' +
              '<summary class="visual-panel-head view-summary"><div><h2>Product cost</h2><p>Acrylic Plaque and General · Enterprise Builder price<span class="catalog-type product-type">Product cost</span></p></div><span id="productCostSummaryStatus" class="section-status good">Normal</span></summary>' +
              '<div class="product-cost-sections">' +
                '<details id="acrylicProductToggle" class="product-list-toggle"><summary class="product-list-summary"><div><strong>Acrylic Plaque product cost</strong><small>' + acrylicProducts.length + ' designs · Enterprise Builder price</small></div></summary><div id="acrylicProductList" class="product-list"></div></details>' +
                '<details id="generalProductToggle" class="product-list-toggle"><summary class="product-list-summary"><div><strong>General product cost</strong><small>' + generalProducts.length + ' product' + (generalProducts.length === 1 ? '' : 's') + ' · Enterprise Builder price</small></div></summary><div id="generalProductList" class="product-list"></div></details>' +
              '</div>' +
            '</details>' +
          '</section>');
        const shippingView = document.querySelector('#shippingCatalogView');
        const visualSuite = document.querySelector('#visualSuite');
        if (shippingView && visualSuite) shippingView.before(visualSuite);
        document.querySelector('#acrylicProductList').innerHTML = renderCostRows(acrylicProducts);
        document.querySelector('#generalProductList').innerHTML = renderCostRows(generalProducts);
        document.querySelector('#visualProductSelect').addEventListener('change', () => renderVisuals(products, data));
      }

      const select = document.querySelector('#visualProductSelect');
      if (!select || products.length === 0) return;
      const product = products.find((item) => item.productKey === select.value) || products[0];
      select.value = product.productKey;
      renderFulfillmentChart(product);

      const production = parseRange(product.production?.range);
      const completeRoutes = shippingColumns.filter((region) => parseRange(product.shipping?.[region]?.time));
      const productChanges = data?.changes || [];
      const fulfillmentNeedsReview = !production || completeRoutes.length < shippingColumns.length || productChanges.some((change) => change.field === 'production.range' || change.field.endsWith('.time'));
      const costNeedsReview = productChanges.some((change) => change.field.startsWith('pricing.'));
      const shippingNeedsReview = productChanges.some((change) => change.field.startsWith('shipping.'));
      const setSectionStatus = (selector, label, tone) => {
        const node = document.querySelector(selector);
        if (!node) return;
        node.className = 'section-status ' + tone;
        node.textContent = label;
      };
      setSectionStatus('#fulfillmentSummaryStatus', fulfillmentNeedsReview ? 'Review window' : 'Normal', fulfillmentNeedsReview ? 'review' : 'good');
      setSectionStatus('#productCostSummaryStatus', costNeedsReview ? 'Review changes' : 'Normal', costNeedsReview ? 'review' : 'good');
      setSectionStatus('#shippingCatalogSummaryStatus', shippingNeedsReview ? 'Review changes' : 'Normal', shippingNeedsReview ? 'review' : 'good');
    };

    const classifyChange = (change) => {
      if (change.direction === 'new') return 'provided';
      if (change.direction === 'missing') return 'missing';
      const previous = parseMoney(change.previous);
      const current = parseMoney(change.current);
      if (previous !== null && current !== null) {
        if (current > previous) return 'increase';
        if (current < previous) return 'decrease';
      }
      return change.direction === 'provided' ? 'provided' : 'changed';
    };

    const statusText = (value) => {
      if (value === undefined) return 'Field not provided';
      if (value === null) return 'Provided (null)';
      if (Array.isArray(value)) return `${value.length} active`;
      if (typeof value === 'object') return value.name || value.description || JSON.stringify(value);
      return String(value);
    };

    const statusTone = (value) => {
      const raw = typeof value === 'object' && value !== null
        ? value.description || value.indicator || ''
        : String(value ?? '');
      const normalized = raw.toUpperCase();
      if (normalized.includes('DOWN') || normalized.includes('MAJOR') || normalized.includes('OUTAGE') || normalized.includes('INCIDENT')) {
        return { className: 'status-outage', label: 'Incident / Outage' };
      }
      if (normalized.includes('DEGRADED') || normalized.includes('MAINTENANCE') || normalized.includes('PARTIAL')) {
        return { className: 'status-degraded', label: 'Degraded / Maintenance' };
      }
      if (normalized === 'UP' || normalized.includes('OPERATIONAL') || normalized.includes('OK')) {
        return { className: 'status-operational', label: 'Operational' };
      }
      return { className: 'status-unknown', label: raw || 'Unknown' };
    };

    const componentTone = (value) => {
      const normalized = String(value ?? '').toUpperCase();
      if (normalized.includes('DOWN') || normalized.includes('MAJOR') || normalized.includes('OUTAGE') || normalized.includes('INCIDENT')) return 'outage';
      if (normalized.includes('DEGRADED') || normalized.includes('MAINTENANCE') || normalized.includes('PARTIAL')) return 'degraded';
      if (normalized === 'OPERATIONAL' || normalized === 'UP' || normalized === 'OK') return 'operational';
      return 'unknown';
    };

    const sectionStatusTone = (className) => className === 'status-operational' ? 'good' : className === 'status-degraded' ? 'review' : className === 'status-outage' ? 'error' : 'unknown';

    const renderStatus = (data) => {
      const status = data.status;
      if (!status || !Array.isArray(status.components)) {
        return '<details class="status-panel status-unknown view-section" aria-label="ShineOn System Status"><summary class="status-head status-summary view-summary"><div><div class="eyebrow">ShineOn platform</div><h2>ShineOn System Status</h2><p>Status data has not been fetched yet.</p></div><span class="section-status unknown">Unknown</span></summary><div class="status-content"><div class="status-note">The current product snapshot does not contain a ShineOn status payload. Run the fetch script to add it.</div></div></details>';
      }

      const overall = statusTone(status.pageStatus);
      const allComponentsOperational = status.components.length > 0 && status.components.every((component) => componentTone(component.status) === 'operational');
      const summaryLabel = overall.className === 'status-operational' && allComponentsOperational ? 'Normal' : overall.label;
      const statusChanges = data.statusChanges || [];
      const changeMessage = data.statusComparisonStatus === 'baseline'
        ? '<div class="status-note">Baseline captured. The next successful fetch will compare ShineOn status and component fields.</div>'
        : statusChanges.length === 0
          ? '<div class="status-note">No status updates detected since the previous ShineOn status snapshot.</div>'
          : '<div class="status-note status-note-change"><strong>Status updates detected.</strong><ul class="status-change-list">' + statusChanges.map((change) => '<li><strong>' + escapeHtml(change.label) + '</strong>: ' + escapeHtml(statusText(change.previous)) + ' → ' + escapeHtml(statusText(change.current)) + '</li>').join('') + '</ul></div>';
      const componentsMarkup = status.components.map((component) => {
        const tone = componentTone(component.status);
        const groupLabel = component.group === undefined || component.group === null ? 'Group not provided' : statusText(component.group);
        return '<div class="component-row"><div><span class="component-name">' + escapeHtml(component.name || 'Unnamed component') + '</span><small class="component-group">' + escapeHtml(groupLabel) + '</small></div><span class="component-status ' + tone + '">' + escapeHtml(statusText(component.status)) + '</span></div>';
      }).join('');
      const summaryUrl = data.sources?.statusSummary || status.sources?.summary;
      const componentsUrl = data.sources?.statusComponents || status.sources?.components;
      const metrics = [];
      if (Object.hasOwn(status, 'activeIncidents')) metrics.push('<div class="status-metric"><span>Active incidents</span><strong>' + escapeHtml(statusText(status.activeIncidents)) + '</strong></div>');
      if (Object.hasOwn(status, 'activeMaintenances')) metrics.push('<div class="status-metric"><span>Active maintenances</span><strong>' + escapeHtml(statusText(status.activeMaintenances)) + '</strong></div>');
      metrics.push('<div class="status-metric"><span>Fetched</span><strong>' + escapeHtml(formatDate(status.fetchedAt || data.fetchedAt)) + '</strong></div>');
      const missingOptionalNote = !Object.hasOwn(status, 'activeIncidents') && !Object.hasOwn(status, 'activeMaintenances')
        ? '<div class="status-note">The public status response did not return active incident or maintenance fields.</div>'
        : '';

      return '<details class="status-panel ' + overall.className + ' view-section" aria-label="ShineOn System Status">' +
        '<summary class="status-head status-summary view-summary"><div><div class="eyebrow">ShineOn platform</div><h2>ShineOn System Status</h2><p>Public status snapshot with incident, maintenance and component visibility.</p></div><span class="section-status ' + sectionStatusTone(overall.className) + '">' + escapeHtml(summaryLabel) + '</span></summary>' +
        '<div class="status-content"><div class="status-grid' + (metrics.length === 1 ? ' status-grid-compact' : '') + '">' + metrics.join('') + '</div>' +
        missingOptionalNote + changeMessage +
        '<details class="status-components" open><summary>Components (' + status.components.length + ')</summary><div class="component-list">' + componentsMarkup + '</div></details>' +
        '<div class="status-sources">Sources:' + (summaryUrl ? '<a href="' + escapeHtml(summaryUrl) + '">summary API</a>' : '') + (componentsUrl ? '<a href="' + escapeHtml(componentsUrl) + '">components API</a>' : '') + '</div></div>' +
        '</details>';
    };

    const renderSnapshot = (data) => {
      const products = data.products || [];
      const families = [...new Set(products.map((product) => product.family))];
      const changes = data.changes || [];
      const changesByProduct = new Map();
      changes.forEach((change) => {
        const list = changesByProduct.get(change.productKey) || [];
        list.push(change);
        changesByProduct.set(change.productKey, list);
      });

      document.querySelector('#meta').innerHTML = `
        <span class="pill"><strong>${families.length}</strong> families</span>
        <span class="pill"><strong>${products.length}</strong> variants</span>
        <span class="pill"><strong>${changes.length}</strong> changes</span>
        <span class="pill">Fetched <strong>${escapeHtml(formatDate(data.fetchedAt))}</strong></span>`;

      const staleWarning = isStale(data.fetchedAt) ? '<div class="alert">This product snapshot is more than 24 hours old. The displayed values are retained, but should be rechecked before pricing or listing changes.</div>' : '';
      const comparisonMessage = data.comparisonStatus === 'baseline'
        ? '<div class="alert">Baseline captured. The next successful fetch will compare these product values and show field-level changes.</div>'
        : changes.length === 0
          ? '<div class="alert">No cost, shipping or production changes detected since the previous snapshot.</div>'
          : '';
      const changePanel = changes.length > 0 ? `<section class="panel"><div class="panel-head"><div><h2>Detected changes</h2><p>Only fields that changed between successful snapshots are listed.</p></div><span class="badge change">${changes.length} change${changes.length === 1 ? '' : 's'}</span></div><div class="changes">${changes.map((change) => `<div class="change-row"><div class="change-product">${escapeHtml(change.productName)}</div><div class="change-field">${escapeHtml(change.label)}</div><div><span class="value-old">${escapeHtml(change.previous || 'Not provided')}</span> → <span class="value-new">${escapeHtml(change.current || 'Not provided')}</span></div></div>`).join('')}</div></section>` : '';

      const shippingCatalog = `<details id="shippingCatalogView" class="panel shipping-view view-section"><summary class="panel-head view-summary"><div><h2>Shipping catalog</h2><p>Acrylic Plaque and General shipping prices and delivery windows by region<span class="catalog-type shipping-type">Shipping catalog</span></p></div><span id="shippingCatalogSummaryStatus" class="section-status good">Normal</span></summary><div class="shipping-catalog-body">${families.map((family) => renderFamily(family, products.filter((product) => product.family === family), changesByProduct)).join('')}</div></details>`;
      document.querySelector('#app').innerHTML = `${staleWarning}${comparisonMessage}${changePanel}${shippingCatalog}`;
      const firstAlert = document.querySelector('#app > .alert');
      const statusPanel = renderStatus(data);
      if (firstAlert) firstAlert.insertAdjacentHTML('afterend', statusPanel);
      else document.querySelector('#app').insertAdjacentHTML('afterbegin', statusPanel);
      const changeRows = document.querySelectorAll('.change-row');
      changes.forEach((change, index) => {
        const row = changeRows[index];
        if (!row) return;
        const tone = classifyChange(change);
        row.classList.add(tone);
        const valueCell = row.lastElementChild;
        const arrowNode = Array.from(valueCell.childNodes).find((node) => node.nodeType === Node.TEXT_NODE && node.textContent.includes('??'));
        if (arrowNode) arrowNode.textContent = ' → ';
        const direction = document.createElement('span');
        direction.className = 'change-direction';
        direction.textContent = tone === 'increase' ? 'increase' : tone === 'decrease' ? 'decrease' : tone === 'missing' ? 'removed' : 'provided';
       valueCell.append(direction);
     });
      document.querySelectorAll('details.family-panel').forEach((section, index) => {
        section.classList.add('shipping-panel');
        const family = families[index];
        const count = products.filter((product) => product.family === family).length;
        const heading = section.querySelector('.family-summary h2');
        const description = section.querySelector('.family-summary p');
        const badge = section.querySelector('.family-summary .badge');
        if (heading) heading.textContent = family + ' shipping catalog';
        if (description) description.textContent = count + ' tracked variant' + (count === 1 ? '' : 's') + ' · shipping prices and delivery windows by region';
        if (badge) {
          badge.textContent = 'Shipping';
          badge.classList.remove('good');
          badge.classList.add('shipping-badge');
        }
      });
      document.querySelector('#footer').innerHTML = `<div>Sources: <a href="${escapeHtml(data.sources.statusSummary || data.status?.sources?.summary || '#')}">status summary</a> · <a href="${escapeHtml(data.sources.statusComponents || data.status?.sources?.components || '#')}">status components</a> · <a href="${escapeHtml(data.sources.production)}">production article</a> · <a href="${escapeHtml(data.sources.shipping)}">shipping article</a> · <a href="${escapeHtml(data.sources.pricesSheet)}">prices sheet</a> · <a href="https://status.shineon.com/en/terms">source terms</a></div><div>Product values are source snapshots; shipping and production ranges can vary by product, destination, volume and season.</div>`;
    };

    fetch(DATA_URL, { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        if (!data || !Array.isArray(data.products) || !data.sources) throw new Error('Invalid product snapshot structure');
        renderSnapshot(data);
        renderVisuals(data.products, data);
      })
      .catch((error) => renderError(`${error.message}. Try again later.`));
  </script>
</body>
</html>
